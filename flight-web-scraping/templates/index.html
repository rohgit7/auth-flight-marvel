<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyScan | Flight Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 1)), 
                        url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            padding: 2.5rem;
        }
        .btn-primary {
            background-color: #0066cc;
            border: none;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #0052a3;
            transform: translateY(-1px);
        }
        .form-label {
            font-weight: 600;
            color: #333;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ddd;
        }
        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            text-align: center;
            padding-top: 20%;
        }
        .spinner-border { width: 3rem; height: 3rem; color: #0066cc; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner-border" role="status"></div>
    <h4 class="mt-3">Analyzing Flight Data...</h4>
    <p class="text-muted">This may take about 20 seconds.</p>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-8">
            <div class="glass-card">
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color: #0066cc;">MarvelSky</h2>
                     <h2>Welcome {{ username }}</h2>
                     <h3>Flight Web Scraping Tool</h3>
                    <p class="text-muted">Premium Price for flights from Bangalore</p>
                </div>
                
                <form action="/track" method="POST" onsubmit="showLoading()">
                    <div class="row">
                        <div class="col-md-12 mb-3">
                            <label class="form-label">Destination Code</label>
                            <input type="text" name="to_code" class="form-control" placeholder="e.g. JFK" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Departure</label>
                            <input type="date" name="depart_date" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Return</label>
                            <input type="date" name="return_date" class="form-control">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Report Recipient Email</label>
                        <input type="email" name="receiver_email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 shadow-sm">
                        GENERATE REPORT and SEND EMAIL
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function showLoading() {
        document.getElementById('loading-overlay').style.display = 'block';
    }
</script>

</body>
</html>
